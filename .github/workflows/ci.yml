name: CI

on:
  push:
    branches: [ CI/CD.test_runner, master/messages ]
  pull_request:
    branches: [ master/messages ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pre-commit
      - run: cd Group4 && pre-commit run --all-files

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r Group4/requirements.txt
      - name: Setup database
        run:
          cd Group4
          python init_db.py || echo "DB init failed (maybe already initialized)"
      - name: Start application
        run:
          echo "Checking PostgreSQL..."
          pg_isready -h postgres -U postgres || echo "PostgreSQL not ready"

          for i in {1..30}; do
            if pg_isready -h postgres -U postgres; then
              echo "PostgreSQL is ready!"
              break
            fi
            sleep 1
          done

          cd Group4
          export DATABASE_URL="postgresql://postgres:postgres@postgres:5432/test_db"

          echo "Testing database connection..."
          python -c "import os; import psycopg2; conn = psycopg2.connect(os.getenv('DATABASE_URL')); print('Database connection successful!')"

          echo "Starting application..."
          uvicorn main:app --host 0.0.0.0 --port 8000 &

          echo "Waiting for app to start..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/; then
              echo "App started successfully!"
              break
            fi
            sleep 1
          done

          if ! curl -s http://127.0.0.1:8000/; then
            echo "❌ App failed to start!"
            exit 1
          fi
      - name: Run tests
        run: cd Group4 && pytest tests/ -v

